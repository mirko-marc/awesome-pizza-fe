<article class="surface-card group flex h-full flex-col overflow-hidden transition duration-300 hover:-translate-y-1 hover:shadow-xl">
  <div class="relative grid h-44 place-items-center overflow-hidden bg-gradient-to-br from-secondary/30 via-primary/10 to-accent/20">
    <div class="absolute -right-8 -top-10 size-28 rounded-full bg-secondary/20 blur-2xl"></div>
    <div class="select-none text-[7rem] drop-shadow-xl transition duration-300 group-hover:scale-110" aria-hidden="true">🍕</div>
  </div>

  <div class="flex flex-1 flex-col p-5">
    <div class="flex items-start justify-between gap-3">
      <h3 class="font-display text-xl font-bold">{{ pizza().name }}</h3>
      <span class="shrink-0 font-bold text-primary">{{ pizza().price | currency: 'EUR' }}</span>
    </div>
    <p class="mt-2 flex-1 text-sm leading-6 text-base-content/65">{{ pizza().description }}</p>

    <div class="mt-5 flex items-center justify-between border-t border-base-300 pt-4">
      <span class="text-sm font-semibold">Quantità</span>
      <div class="join" aria-label="Controlli quantità">
        <button
          type="button"
          class="btn join-item btn-sm"
          [disabled]="quantity() === 0"
          (click)="quantityChange.emit(quantity() - 1)"
          [attr.aria-label]="'Rimuovi una ' + pizza().name"
        >
          <span class="material-icons text-base" aria-hidden="true">remove</span>
        </button>
        <span class="join-item grid min-w-10 place-items-center border-y border-base-300 bg-base-100 text-sm font-bold" aria-live="polite">
          {{ quantity() }}
        </span>
        <button
          type="button"
          class="btn join-item btn-sm btn-primary"
          (click)="quantityChange.emit(quantity() + 1)"
          [attr.aria-label]="'Aggiungi una ' + pizza().name"
        >
          <span class="material-icons text-base" aria-hidden="true">add</span>
        </button>
      </div>
    </div>
  </div>
</article>
