<div class="min-h-screen bg-base-200">
  <header class="sticky top-0 z-40 border-b border-base-300 bg-neutral text-neutral-content shadow-sm">
    <div class="page-shell navbar min-h-16 px-0">
      <div class="navbar-start">
        <a routerLink="/admin" class="focus-ring flex items-center gap-3 rounded-lg" aria-label="Pannello amministrativo Awesome Pizza">
          <span class="grid size-10 place-items-center rounded-full bg-primary text-primary-content">
            <span class="material-icons" aria-hidden="true">local_pizza</span>
          </span>
          <div>
            <span class="block font-display text-lg font-bold leading-tight">Awesome Pizza</span>
            <span class="block text-[0.65rem] font-bold uppercase tracking-[0.18em] text-neutral-content/55">Area amministrativa</span>
          </div>
        </a>
      </div>

      <div class="navbar-end gap-1">
        <span class="hidden text-sm text-neutral-content/65 sm:inline">{{ authStore.username() }}</span>
        <button
          type="button"
          class="btn btn-circle btn-ghost"
          (click)="themeService.toggle()"
          [attr.aria-label]="themeService.theme() === 'pizzalight' ? 'Usa tema scuro' : 'Usa tema chiaro'"
        >
          <span class="material-icons" aria-hidden="true">{{ themeService.theme() === 'pizzalight' ? 'dark_mode' : 'light_mode' }}</span>
        </button>
        <button type="button" class="btn btn-ghost" (click)="logout()">
          <span class="material-icons text-lg" aria-hidden="true">logout</span>
          <span class="hidden sm:inline">Esci</span>
        </button>
      </div>
    </div>
  </header>

  <main><router-outlet /></main>
</div>
