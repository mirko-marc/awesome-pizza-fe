<div class="alert border border-error/25 bg-error/10 text-base-content" role="alert">
  <span class="material-icons text-error" aria-hidden="true">error_outline</span>
  <div class="min-w-0 flex-1">
    <p class="font-semibold">{{ title() }}</p>
    <p class="text-sm text-base-content/70">{{ message() }}</p>
  </div>
  @if (retryable()) {
    <button type="button" class="btn btn-sm btn-outline" (click)="retry.emit()">Riprova</button>
  }
</div>
